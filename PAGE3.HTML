<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Memories ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
    background: linear-gradient(135deg, #f857a6, #ff5858);
}

h1 {
    margin-top: 35px;
    font-size: 38px;
}

.subtitle {
    font-size: 18px;
}

.gallery {
    width: 90%;
    max-width: 900px;
    margin: 35px auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 18px;
}

.gallery img {
    width: 100%;
    height: 230px;
    object-fit: cover;
    border-radius: 18px;
    border: 4px solid white;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    transition: 0.3s;
}

.gallery img:hover {
    transform: scale(1.05);
}

button {
    padding: 15px 30px;
    border: none;
    border-radius: 30px;
    background: white;
    color: #e84393;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin: 20px;
}

button:hover {
    transform: scale(1.08);
}
</style>
</head>

<body>

<h1> Our Beautiful Memories ❤️</h1>

<p class="subtitle">
Every picture has a story... and every story has you. 💕
</p>

<div class="gallery">

    <img src="photo1.jpg" alt="Memory 1">

    <img src="photo2.jpg" alt="Memory 2">

    <img src="photo3.jpg" alt="Memory 3">

    <img src="photo4.jpg" alt="Memory 4">

</div>

<button onclick="goToFinal()">
    💖 One More Surprise
</button>

<script>

function goToFinal() {
    window.location.href = "PAGE4.HTML";
}

</script>


</body>
</html>
